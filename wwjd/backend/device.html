<!doctype html><html lang="en"><meta charset="utf-8"><title>Account details</title><script>
const query=new URLSearchParams(location.search), target=new URLSearchParams();
if(query.get('accountId')) target.set('account',query.get('accountId'));
else if(query.get('deviceId')) target.set('device',query.get('deviceId'));
if(query.get('contactId')) target.set('fromContact',query.get('contactId'));
location.replace('index.html#'+(target.toString()||'users'));
</script><a href="index.html#users">Open user accounts</a></html>
