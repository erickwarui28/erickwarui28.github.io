<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let preference = 'system';
        try { preference = localStorage.getItem('es-todo-theme') || 'system'; } catch {}
        const dark = preference === 'dark' || (preference !== 'light' && typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0"
    />
    <title>OverPowered To-Do App</title>
    <style>
      .startup-screen{min-height:100vh;min-height:100dvh;display:grid;place-content:center;justify-items:center;gap:18px;margin:0;background:#f7f8fa;color:#17211b;font:16px system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
      [data-theme="dark"] .startup-screen{background:#0b0b0b;color:#f5f5f5}
      .startup-screen p{margin:0}.startup-screen strong{font-size:22px}
      .startup-spinner{width:28px;height:28px;border:3px solid #22c55e33;border-top-color:#22c55e;border-radius:50%;animation:startup-spin .9s linear infinite}
      @keyframes startup-spin{to{transform:rotate(360deg)}}
      @media(prefers-reduced-motion:reduce){.startup-spinner{animation:none}}
      body{margin:0}
    </style>
    <script type="module" crossorigin src="/es-todo/assets/index-DnHfTLH8.js"></script>
    <link rel="stylesheet" crossorigin href="/es-todo/assets/index-CQjsRriT.css">
  </head>
  <body>
    <div id="root"><main class="startup-screen" role="status" aria-live="polite"><img src="./icon-192.png" width="64" height="64" alt=""><strong>OverPowered To-Do App</strong><span class="startup-spinner" aria-hidden="true"></span><p>Opening your workspace…</p><noscript>Enable JavaScript to open the app.</noscript></main></div>
  </body>
</html>
